<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가치관 인증서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --paper:#FAF6EC;
    --paper-edge:#EFE7D2;
    --gold:#B8912B;
    --stamp:#A83B32;
    --line:#D8CDA9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper-edge);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(184,145,43,0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(27,42,74,0.05), transparent 40%);
    font-family:'Pretendard', sans-serif;
    display:flex;
    justify-content:center;
    padding:36px 16px 80px;
    color:var(--ink);
  }
  .cert{
    width:100%;
    max-width:640px;
    background:var(--paper);
    border:2px solid var(--ink);
    outline:1px solid var(--gold);
    outline-offset:-8px;
    padding:40px 32px 32px;
    position:relative;
    box-shadow:0 18px 40px rgba(27,42,74,0.15);
  }
  .cert::before, .cert::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    border:2px solid var(--gold);
  }
  .cert::before{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .cert::after{ bottom:-2px; right:-2px; border-left:none; border-top:none; }

  .eyebrow{
    text-align:center;
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    text-align:center;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    text-align:center;
    font-size:13px;
    color:#6b6252;
    margin-bottom:26px;
  }
  .name-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin-bottom:28px;
    font-family:'Noto Serif KR', serif;
    font-size:15px;
  }
  .name-row input{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    text-align:center;
    width:140px;
    padding:2px 4px;
    color:var(--ink);
  }
  .name-row input:focus{ outline:none; border-bottom-color:var(--stamp); }

  .section{ margin-bottom:26px; }
  .section-title{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    color:var(--ink);
  }
  .section-title .dot{
    width:8px;height:8px;background:var(--stamp);border-radius:50%;
    display:inline-block;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:#fff;
    padding:10px 8px;
    text-align:center;
  }
  .chip span{
    display:block;
    font-size:10px;
    color:var(--gold);
    font-weight:600;
    margin-bottom:4px;
  }
  .chip input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
  }
  .chip input:focus{ outline:none; }
  .chip input::placeholder{ color:#c9c0a8; font-weight:400; }

  .sentence-box{
    border:1.5px dashed var(--gold);
    background:#fff;
    padding:22px 18px;
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    line-height:2.1;
    text-align:center;
  }
  .sentence-box .blank{
    display:inline-block;
    border-bottom:2px solid var(--ink);
    min-width:90px;
    padding:0 4px;
  }
  .sentence-box input{
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    font-weight:700;
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    text-align:center;
    width:110px;
    color:var(--stamp);
  }
  .sentence-box input:focus{ outline:none; }
  .sentence-box input::placeholder{ color:#c9c0a8; font-weight:400; font-size:13px; }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:30px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .footer-left{
    font-size:11px;
    color:#8a8065;
    line-height:1.6;
  }
  .stamp{
    width:78px; height:78px;
    border:3px solid var(--stamp);
    border-radius:50%;
    color:var(--stamp);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:12px;
    line-height:1.3;
    transform:rotate(-8deg);
    opacity:0.85;
  }

  .toolbar{
    max-width:640px;
    width:100%;
    margin:16px auto 0;
    display:flex;
    justify-content:center;
  }
  .toolbar button{
    font-family:'Pretendard', sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:12px 22px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .toolbar button:hover{ background:var(--stamp); }
  .hint{
    text-align:center;
    font-size:12px;
    color:#8a8065;
    margin-top:10px;
  }

  @media (max-width:480px){
    .chip-grid{ grid-template-columns:repeat(2,1fr); }
    h1{ font-size:23px; }
    .cert{ padding:30px 18px 24px; }
  }
</style>
</head>
<body>

<div>
  <div class="cert" id="cert">
    <div class="eyebrow">SELF-DISCOVERY CERTIFICATE</div>
    <h1>나의 가치관 인증서</h1>
    <div class="sub">전주여자상업고등학교 · 진로수업 4차시</div>

    <div class="name-row">
      <span>이름</span>
      <input type="text" placeholder="○○○" maxlength="10">
    </div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>나의 강점 3가지</div>
      <div class="chip-grid">
        <div class="chip"><span>STRENGTH 1</span><input type="text" placeholder="예: 꼼꼼함"></div>
        <div class="chip"><span>STRENGTH 2</span><input type="text" placeholder="예: 공감력"></div>
        <div class="chip"><span>STRENGTH 3</span><input type="text" placeholder="예: 끈기"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>나의 가치관 3가지</div>
      <div class="chip-grid">
        <div class="chip"><span>VALUE 1</span><input type="text" placeholder="예: 안정"></div>
        <div class="chip"><span>VALUE 2</span><input type="text" placeholder="예: 성장"></div>
        <div class="chip"><span>VALUE 3</span><input type="text" placeholder="예: 협력"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>나의 진로 주제 한 문장</div>
      <div class="sentence-box">
        나는 <input type="text" placeholder="어떠한">  사람이라서<br>
        <input type="text" placeholder="관심 계열" style="width:150px;"> 계열에 관심이 간다.
      </div>
    </div>

    <div class="footer-row">
      <div class="footer-left">
        DISCOVERED ON<br>
        <span id="today"></span>
      </div>
      <div class="stamp">SELF<br>CERTIFIED</div>
    </div>
  </div>

  <div class="toolbar">
    <button onclick="window.print()">🖨️ 인쇄 / PDF로 저장</button>
  </div>
  <p class="hint">작성 후 화면을 캡쳐하거나, 버튼을 눌러 PDF로 저장해보세요.</p>
</div>

<script>
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  document.getElementById('today').textContent = `${y}.${m}.${d}`;
</script>

</body>
</html>
