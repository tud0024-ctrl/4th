<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 강점·가치관 카드 | 4차시</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:#eef2f5;color:#26323b}
.page{width:100vw;height:100vh;padding:2.8vh 4vw;display:flex;flex-direction:column}
.header{height:17%;display:flex;align-items:center;justify-content:space-between}
.badge{display:inline-block;background:#e7f0f5;color:#58758a;border-radius:999px;padding:7px 14px;font-size:clamp(11px,1vw,15px);font-weight:700}
h1{font-size:clamp(25px,2.6vw,40px);margin:10px 0 4px;letter-spacing:-1.5px}
.sub{font-size:clamp(11px,1vw,15px);color:#707a82;margin:0}
.top-tip{font-size:clamp(10px,.85vw,13px);color:#8a939a}
.main{height:70%;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:1.2vw}
.card{background:#fff;border:1px solid #dfe4e8;border-radius:18px;padding:2vh 1.5vw;box-shadow:0 5px 18px rgba(30,45,55,.06);min-width:0}
.card h2{font-size:clamp(16px,1.45vw,23px);margin:0 0 7px}
.hint{font-size:clamp(10px,.78vw,13px);color:#818b92;line-height:1.4;margin:0 0 14px}
.fields{display:flex;flex-direction:column;gap:10px}
label{font-size:clamp(10px,.78vw,13px);font-weight:700;color:#69747c;display:block;margin-bottom:4px}
input{width:100%;height:5.1vh;min-height:29px;padding:7px 11px;border:1px solid #d7dde1;border-radius:10px;background:#fafcfd;font-size:clamp(12px,1vw,16px);outline:none}
input:focus{border-color:#91aaba;background:#fff;box-shadow:0 0 0 3px rgba(145,170,186,.12)}
.result{display:flex;flex-direction:column}
.sentencebox{flex:1;display:flex;align-items:center;justify-content:center;background:#f6fafc;border:1px solid #d9e5eb;border-radius:14px;padding:2vw}
.sentence{font-size:clamp(18px,1.55vw,25px);line-height:2.35;font-weight:700;text-align:center;word-break:keep-all}
.sentence input{width:7.5em;display:inline-block;height:4.3vh;border:0;border-bottom:2px solid #718b9a;border-radius:0;background:transparent;text-align:center;font-weight:700;padding:0 4px;font-size:inherit}
.footer{height:13%;display:flex;align-items:center;justify-content:space-between}
.footer-tip{font-size:clamp(10px,.85vw,13px);color:#8a939a}
.buttons{display:flex;gap:8px}
button{border:0;border-radius:10px;padding:10px 16px;font-size:clamp(11px,.85vw,14px);font-weight:800;cursor:pointer}
.save{background:#334a59;color:#fff}.reset{background:#e7ebee;color:#4f5961}
@media(max-aspect-ratio:1.2/1){html,body{overflow:auto}.page{height:auto;min-height:100vh}.header,.footer{height:auto;margin:15px 0}.main{height:auto;grid-template-columns:1fr}.card{min-height:230px}.sentencebox{min-height:180px}}
</style>
</head>
<body>
<div class="page">
<header class="header">
<div>
<span class="badge">4차시 · 나의 가치관 탐색하고 이해하기</span>
<h1>나의 강점 · 가치관 카드</h1>
<p class="sub">나를 잘 보여주는 단어를 직접 입력해 보세요.</p>
</div>
<div class="top-tip">입력한 내용은 자동 저장됩니다.</div>
</header>

<main class="main">
<section class="card">
<h2>① 나의 강점 3가지</h2>
<p class="hint">내가 잘하거나 다른 사람이 자주 말해주는 장점을 적어보세요.</p>
<div class="fields">
<div><label>강점 ①</label><input id="s1" placeholder="예: 소통"></div>
<div><label>강점 ②</label><input id="s2" placeholder="예: 책임감"></div>
<div><label>강점 ③</label><input id="s3" placeholder="예: 끈기"></div>
</div>
</section>

<section class="card">
<h2>② 나의 가치관 3가지</h2>
<p class="hint">진로나 일을 선택할 때 중요하게 생각하는 것을 적어보세요.</p>
<div class="fields">
<div><label>가치관 ①</label><input id="v1" placeholder="예: 안정"></div>
<div><label>가치관 ②</label><input id="v2" placeholder="예: 성장"></div>
<div><label>가치관 ③</label><input id="v3" placeholder="예: 도움"></div>
</div>
</section>

<section class="card result">
<h2>③ 나의 진로 주제 한 문장</h2>
<p class="hint">나의 강점과 가치관을 생각하며 관심이 가는 계열을 적어보세요.</p>
<div class="sentencebox">
<div class="sentence">
나는 <input id="trait" placeholder="소통을 잘하는"> 사람이라서<br>
<input id="field" placeholder="금융"> 계열에 관심이 간다.
</div>
</div>
</section>
</main>

<footer class="footer">
<div class="footer-tip">완성 후 <b>완성본 이미지 저장</b>을 눌러 결과물을 제출할 수 있습니다.</div>
<div class="buttons">
<button class="save" onclick="saveCard()">완성본 이미지 저장</button>
<button class="reset" onclick="resetCard()">다시 쓰기</button>
</div>
</footer>
</div>

<script>
const ids=["s1","s2","s3","v1","v2","v3","trait","field"];
ids.forEach(id=>{
 const e=document.getElementById(id);
 e.value=localStorage.getItem("career16_"+id)||"";
 e.addEventListener("input",()=>localStorage.setItem("career16_"+id,e.value));
});
function resetCard(){
 if(confirm("작성한 내용을 모두 지울까요?")){
  ids.forEach(id=>{document.getElementById(id).value="";localStorage.removeItem("career16_"+id)});
 }
}
function saveCard(){
 const val=id=>document.getElementById(id).value||"________";
 const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900">
 <rect width="1600" height="900" fill="#eef2f5"/>
 <rect x="55" y="45" width="1490" height="810" rx="32" fill="white" stroke="#dfe4e8"/>
 <text x="800" y="105" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#58758a">4차시 · 나의 가치관 탐색하고 이해하기</text>
 <text x="800" y="160" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="38" font-weight="800" fill="#26323b">나의 강점 · 가치관 카드</text>
 <text x="120" y="235" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="800">나의 강점 3가지</text>
 <text x="120" y="295" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">① ${esc(val("s1"))}</text>
 <text x="120" y="350" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">② ${esc(val("s2"))}</text>
 <text x="120" y="405" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">③ ${esc(val("s3"))}</text>
 <line x1="535" y1="210" x2="535" y2="500" stroke="#e5e8ea"/>
 <text x="590" y="235" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="800">나의 가치관 3가지</text>
 <text x="590" y="295" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">① ${esc(val("v1"))}</text>
 <text x="590" y="350" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">② ${esc(val("v2"))}</text>
 <text x="590" y="405" font-family="Arial,Malgun Gothic,sans-serif" font-size="25">③ ${esc(val("v3"))}</text>
 <rect x="100" y="465" width="1400" height="300" rx="25" fill="#f6fafc" stroke="#d9e5eb"/>
 <text x="800" y="525" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="800">나의 진로 주제</text>
 <text x="800" y="600" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="31" font-weight="700">나는 ${esc(val("trait"))} 사람이라서</text>
 <text x="800" y="665" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="31" font-weight="700">${esc(val("field"))} 계열에 관심이 간다.</text>
 <text x="800" y="815" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="16" fill="#9aa2a8">나의 진로는 내가 생각하고 선택합니다.</text>
 </svg>`;
 const blob=new Blob([svg],{type:"image/svg+xml"}),url=URL.createObjectURL(blob),img=new Image();
 img.onload=()=>{
  const c=document.createElement("canvas");c.width=1600;c.height=900;
  c.getContext("2d").drawImage(img,0,0);URL.revokeObjectURL(url);
  const a=document.createElement("a");a.download="나의_강점_가치관_진로주제_16대9.png";a.href=c.toDataURL("image/png");a.click();
 };
 img.src=url;
}
</script>
</body>
</html>
